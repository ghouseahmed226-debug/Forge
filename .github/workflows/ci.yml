name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

      - name: Type check with mypy
        run: |
          pip install mypy types-python-jose
          mypy . --ignore-missing-imports --exclude tests/

      - name: Run unit tests (no integration)
        run: |
          pytest tests/ -v -m "not integration" \
            --tb=short \
            --junitxml=test-results.xml
        env:
          ANTHROPIC_API_KEY: "test-key"
          OPENAI_API_KEY: "test-key"
          GOOGLE_API_KEY: "test-key"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-key"
          ENVIRONMENT: "test"
          FRONTEND_URL: "http://localhost:3000"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  # ── Frontend Tests ───────────────────────────────────────────────────────
  frontend-test:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-key"
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"

      - name: Lint
        run: npx eslint . --max-warnings 0
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-key"
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"

      - name: Build check
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-key"
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"

  # ── Security Audit ───────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Check API keys not in frontend bundle
        run: |
          # Ensure no LLM API key env var names appear in the frontend source
          # (NEXT_PUBLIC_ prefix is safe, non-public keys must never appear)
          if grep -r "ANTHROPIC_API_KEY\|OPENAI_API_KEY\|GOOGLE_API_KEY\|SUPABASE_SERVICE_ROLE_KEY" \
            frontend/app frontend/components frontend/lib --include="*.ts" --include="*.tsx"; then
            echo "ERROR: Server-side API key reference found in client code!"
            exit 1
          fi
          echo "✓ No server-side API keys found in client code"

      - name: Frontend npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Backend pip audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969
