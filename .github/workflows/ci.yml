name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ────────────────────────────────────────────────────────
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt ruff mypy

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy . --ignore-missing-imports --exclude tests/

      - name: Run unit tests (no integration)
        run: |
          pytest tests/ -v -m "not integration" \
            --tb=short
        env:
          ANTHROPIC_API_KEY: "test-key"
          OPENAI_API_KEY: "test-key"
          GOOGLE_API_KEY: "test-key"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-key"
          ENVIRONMENT: "test"
          FRONTEND_URL: "http://localhost:3000"

  # ── Frontend Tests ───────────────────────────────────────────────────────
  frontend-test:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-key"
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"

      - name: Lint
        run: npm run lint
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-key"
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"

      - name: Build check
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-key"
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"

  # ── Security Audit ───────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check API keys not in client code
        run: |
          # Verify that server-only API keys are never imported into frontend UI components
          if grep -r "ANTHROPIC_API_KEY\|OPENAI_API_KEY\|GOOGLE_API_KEY\|SUPABASE_SERVICE_ROLE_KEY" \
            frontend/app frontend/components frontend/lib --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "ERROR: Server-side API key reference found in client code!"
            exit 1
          fi
          echo "✓ No server-side API keys found in client code"
